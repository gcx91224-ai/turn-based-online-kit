name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 测试只依赖 Node 内置模块，不需要 npm install
      - name: 语法检查
        run: npm run check

      - name: 单元测试
        run: npm test
